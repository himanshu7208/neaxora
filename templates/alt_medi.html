    <script>
        async function analyzeMedicine() {

            const medName = document.getElementById("medicineInput").value;
            const resultArea = document.getElementById("result");

            if (!medName) {
                alert("Enter medicine name");
                return;
            }

            // Loader
            resultArea.innerHTML = `
        <p>Finding alternatives...</p>
    `;

            try {

                const response = await fetch("/medicine-alternative", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ medicine: medName })
                });

                const data = await response.json();

                let html = `<div style="border:1px solid #ccc; padding:15px; border-radius:10px;">
        <h3>💊 Suggested Alternatives</h3>`;

                data.alternatives.forEach(med => {
                    html += `
                <div style="margin-bottom:15px;">
                    <strong>${med.name}</strong><br>
                    <span>Use: ${med.use}</span><br>
                    <small>${med.note}</small>
                </div>
                <hr>
            `;
                });

                html += `
        <p style="color:red;">⚠️ Consult doctor before using medicines</p>
        </div>
        `;

                resultArea.innerHTML = html;

            } catch (error) {
                resultArea.innerHTML = `<p style="color:red;">Error loading data</p>`;
            }
        }
    </script>
